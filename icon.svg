<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3d1a"/>
      <stop offset="1" stop-color="#0c1a09"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#d4a84b" stop-opacity=".14"/>
      <stop offset="1" stop-color="#d4a84b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ede4c8"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c8b8"/>
      <stop offset="1" stop-color="#dca090"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5c98a"/>
      <stop offset="1" stop-color="#a58044"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d174"/>
      <stop offset="1" stop-color="#b88428"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Warmer Schein hinter dem Kopf -->
  <circle cx="256" cy="290" r="230" fill="url(#glow)"/>

  <!-- Bergsilhouette dezent im Hintergrund -->
  <path d="M -20 420 L 90 300 L 175 380 L 260 260 L 355 360 L 445 310 L 540 380 L 540 470 L -20 470 Z"
        fill="#0a1d0a" opacity=".55"/>
  <!-- Schnee auf höchster Spitze -->
  <path d="M 244 285 L 260 260 L 276 285 L 268 300 L 252 300 Z" fill="#faf5e8" opacity=".7"/>

  <!-- Ohren (hinter dem Kopf) -->
  <g>
    <ellipse cx="132" cy="238" rx="52" ry="42" fill="url(#head)" transform="rotate(-32 132 238)"/>
    <ellipse cx="132" cy="238" rx="30" ry="24" fill="#f0b8a4" transform="rotate(-32 132 238)"/>
    <ellipse cx="380" cy="238" rx="52" ry="42" fill="url(#head)" transform="rotate(32 380 238)"/>
    <ellipse cx="380" cy="238" rx="30" ry="24" fill="#f0b8a4" transform="rotate(32 380 238)"/>
  </g>

  <!-- Hörner -->
  <path d="M 178 178 Q 148 132 172 118 Q 200 130 208 172 Z" fill="url(#horn)" stroke="#7d5c28" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 334 178 Q 364 132 340 118 Q 312 130 304 172 Z" fill="url(#horn)" stroke="#7d5c28" stroke-width="3" stroke-linejoin="round"/>

  <!-- Kopf (Hauptform, weich abgerundet) -->
  <path d="M 256 148
           C 348 148 400 208 400 288
           C 400 348 372 400 322 420
           L 322 428
           Q 322 452 296 460
           L 216 460
           Q 190 452 190 428
           L 190 420
           C 140 400 112 348 112 288
           C 112 208 164 148 256 148 Z"
        fill="url(#head)"/>

  <!-- Schwarze Flecken -->
  <path d="M 168 235 Q 145 215 160 190 Q 185 185 205 210 Q 200 235 168 235 Z" fill="#1a1a1a"/>
  <path d="M 336 220 Q 358 202 372 225 Q 368 250 350 258 Q 328 250 336 220 Z" fill="#1a1a1a"/>
  <ellipse cx="145" cy="335" rx="24" ry="30" fill="#1a1a1a"/>

  <!-- Augen (freundlich, groß) -->
  <ellipse cx="212" cy="280" rx="26" ry="30" fill="#ffffff"/>
  <ellipse cx="300" cy="280" rx="26" ry="30" fill="#ffffff"/>
  <ellipse cx="212" cy="284" rx="15" ry="20" fill="#1a1a1a"/>
  <ellipse cx="300" cy="284" rx="15" ry="20" fill="#1a1a1a"/>
  <circle cx="216" cy="278" r="5" fill="#ffffff"/>
  <circle cx="304" cy="278" r="5" fill="#ffffff"/>
  <circle cx="207" cy="290" r="2.5" fill="#ffffff" opacity=".8"/>
  <circle cx="295" cy="290" r="2.5" fill="#ffffff" opacity=".8"/>

  <!-- Muffel (großes rosa Feld) -->
  <ellipse cx="256" cy="368" rx="92" ry="62" fill="url(#muzzle)"/>
  <!-- Highlight auf Muffel -->
  <ellipse cx="230" cy="345" rx="30" ry="12" fill="#ffffff" opacity=".25"/>
  <!-- Nasenlöcher -->
  <ellipse cx="228" cy="365" rx="8" ry="14" fill="#1a1a1a"/>
  <ellipse cx="284" cy="365" rx="8" ry="14" fill="#1a1a1a"/>
  <!-- Mund (kleines Lächeln) -->
  <path d="M 230 400 Q 256 415 282 400" stroke="#5a2818" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Halsband + Kuhglocke -->
  <rect x="222" y="450" width="68" height="12" fill="#8b3020" rx="3"/>
  <rect x="222" y="450" width="68" height="4" fill="#c14a35" rx="2" opacity=".6"/>
  <!-- Kuhglocke -->
  <path d="M 232 462 L 226 502 L 286 502 L 280 462 Z" fill="url(#bell)" stroke="#7d5010" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="245" cy="475" rx="6" ry="10" fill="#f8e08a" opacity=".55"/>
  <path d="M 226 502 L 286 502 L 288 508 L 224 508 Z" fill="#a07020"/>
  <circle cx="256" cy="512" r="7" fill="#7d5010"/>
</svg>
